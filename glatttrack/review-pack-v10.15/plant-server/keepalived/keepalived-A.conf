# /etc/keepalived/keepalived.conf on server A
global_defs { enable_script_security; script_user root }
vrrp_script chk_pg { script "/opt/glatttrack/plant-server/keepalived/check_pg.sh"; interval 2; fall 3; rise 2 }
vrrp_instance GT_VIP {
  state BACKUP              # both start as BACKUP + nopreempt: a server that comes back never takes the address back
  nopreempt
  interface eth0
  virtual_router_id 51
  priority 150
  advert_int 1
  unicast_src_ip 192.168.1.11
  unicast_peer { 192.168.1.12 }
  authentication { auth_type PASS; auth_pass gtplant1 }
  virtual_ipaddress { 192.168.1.10/24 }
  track_script { chk_pg }
  notify_master "/opt/glatttrack/plant-server/promote.sh"
}

# add to /etc/nut/upsmon.conf (NUT — Network UPS Tools; the UPS is connected by USB)
NOTIFYCMD /opt/glatttrack/plant-server/ups-event.sh
NOTIFYFLAG ONLINE  SYSLOG+EXEC
NOTIFYFLAG ONBATT  SYSLOG+EXEC
NOTIFYFLAG LOWBATT SYSLOG+EXEC
# on low battery upsmon shuts the server down cleanly (SHUTDOWNCMD "/sbin/shutdown -h now")

<!doctype html><html dir="rtl" lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GlattTrack — מרכז שירות</title>
<script src="sc-config.js"></script>
<style>
:root{--bg:#07090F;--panel:#11151F;--panel2:#181D2A;--border:#2A3142;--gold:#D4A843;--text:#E8ECF4;--muted:#8A93A6;--green:#28C76F;--red:#E03030;--amber:#F0A030}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:18px;margin:0;color:var(--gold);flex:1}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--gold);color:#07090F;border:none;border-radius:8px;padding:9px 14px;font-weight:700;font-size:14px}
.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px}
main{padding:16px;max-width:1300px;margin:0 auto}
.tiles{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.tile{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.tile b{display:block;font-size:30px}.n{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pl{background:var(--panel);border:2px solid var(--border);border-radius:12px;padding:12px;cursor:pointer}
.pl.warn{border-color:var(--amber)}.pl.bad{border-color:var(--red);background:#2a0e10;animation:blink 1s infinite}
@keyframes blink{50%{background:#4a1015}}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-inline-start:6px;vertical-align:middle}
.ok .dot,.dot.ok{background:var(--green)}.warn .dot,.dot.warn{background:var(--amber)}.bad .dot,.dot.bad{background:var(--red);box-shadow:0 0 12px var(--red)}
.t{font-size:16px;font-weight:800}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px}
.g{color:var(--green)}.r{color:var(--red)}.a{color:var(--amber)}
input,select{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-size:14px;font-family:inherit}
.cols{display:flex;gap:12px;flex-wrap:wrap}.cols>.card{flex:1;min-width:300px}
.err{color:var(--red);font-size:13px;margin-top:6px}
nav{display:flex;gap:6px;padding:8px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--bg);position:sticky;top:53px;z-index:4}
nav button{background:var(--panel);color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px}
nav button.on{color:#07090F;background:var(--gold);border-color:var(--gold)}
nav button .bd{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:start;vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:12px}.wrap{overflow-x:auto}
.chip{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:700}
.st-new{background:#3a2a08;color:var(--amber)}.st-working{background:#0c2340;color:#5aa8ff}.st-closed{background:#0c2a18;color:var(--green)}
.ro .w{display:none}
/* (owner) code fields: always left to right, 👁 shows / hides the code, a warning when the keyboard writes Hebrew */
.cf{position:relative;display:block;width:100%}.cf input{width:100%;direction:ltr;text-align:left;padding-right:42px;font-family:Consolas,Menlo,monospace;letter-spacing:.5px}
.cf .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:transparent;border:none;font-size:18px;padding:4px 6px;color:var(--muted);line-height:1}
.kbw{display:none;color:var(--amber);font-size:12px;margin-top:4px;text-align:start}.kbw.on{display:block}
.lang{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}.lang button{background:transparent;border:none;color:var(--muted);padding:6px 10px;font-weight:700;font-size:13px}
.lang button.on{background:var(--gold);color:#07090F}.rec{display:block;direction:ltr;text-align:center;font:800 22px Consolas,Menlo,monospace;letter-spacing:2px;color:var(--gold);margin:10px 0}
a.lk{color:var(--gold);font-size:13px}
@media (max-width:600px){main{padding:12px}header h1{font-size:16px}nav{top:49px}}
</style></head><body>
<header><h1 id="ttl">🛰️ GlattTrack — מרכז השירות</h1><span id="who" class="n"></span>
 <span class="lang"><button id="lg_he" onclick="setLang('he')">עב</button><button id="lg_en" onclick="setLang('en')">EN</button></span>
 <button class="ghost" id="bOut" style="display:none" onclick="logout()">יציאה</button></header>
<nav id="tabs" style="display:none"></nav>
<main id="main"></main>

// (owner) a new manufacturer code: the bcrypt hash is made here; the request file goes to the manufacturer's computer to be signed
function makerReq(){
  const a = document.getElementById('mk1').value, b = document.getElementById('mk2').value, x = document.getElementById('mkerr');
  if(a !== b){ x.textContent = L('שני הקודים לא זהים','The two codes are not the same'); return; }
  if(a.length < 10){ x.textContent = er('code_too_short'); return; }
  if(/[\u0590-\u05FF]/.test(a)){ x.textContent = L('הקוד באותיות עבריות — להחליף את המקלדת לאנגלית','The code has Hebrew letters — switch the keyboard to English'); return; }
  x.className = 'n'; x.textContent = L('מכין…','Making…');
  setTimeout(() => {
    try{
      const hash = dcodeIO.bcrypt.hashSync(a, 10);
      const req = JSON.stringify({ v:1, kind:'maker_code', plant:String(CUR), hash });
      const el = document.createElement('a'); el.href = URL.createObjectURL(new Blob([req], { type:'application/json' }));
      el.download = 'maker-code-' + CUR + '.json'; document.body.appendChild(el); el.click(); el.remove();
      document.getElementById('mk1').value = ''; document.getElementById('mk2').value = '';
      x.className = 'g'; x.textContent = L('✓ הקובץ ירד. עכשיו לחתום אותו במחשב של היצרן (שלב 2).','✓ The file was downloaded. Now sign it on the manufacturer\'s computer (step 2).');
    }catch(e){ x.className = 'err'; x.textContent = String(e && e.message || e); }
  }, 30);
}

        <td><label><input type="checkbox" ${s.active?'checked':''} onchange="sset('${E(s.id)}',null,this.checked)"> ${s.active?L('כן','yes'):L('לא','no')}</label></td><td>${E(dt(s.createdAt))}</td>
        <td><button class="ghost" onclick="NEWC='${E(s.id)}';showStaff()">${L('🔑 קוד חדש','🔑 New code')}</button></td></tr>`).join('')}</table></div>
      ${nc ? `<div class="card" style="margin-top:10px;border-color:var(--gold)"><div class="t" style="margin-bottom:6px">🔑 ${E(L('קוד חדש ל-','A new code for ') + nc.name)}</div>
         ${codeField('nc1', L('קוד חדש (לפחות 10 תווים)','New code (at least 10 characters)'))}<div style="height:8px"></div>${codeField('nc2', L('שוב את הקוד החדש','The new code again'), 'setCode()')}
         <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" onclick="setCode()">${L('שמור את הקוד החדש','Save the new code')}</button><button class="ghost" onclick="NEWC=null;showStaff()">${L('ביטול','Cancel')}</button></div>
         <div id="ncerr" class="err"></div><div class="n" style="margin-top:6px">${L('הקוד הישן מפסיק לעבוד מיד, וכל כניסה פתוחה של האדם הזה נסגרת.','The old code stops at once, and every open session of this person is closed.')}</div></div>` : ''}
      <div id="serr" class="err"></div>
      <div class="n" style="margin-top:8px">${L('מנהל — הכל · תמיכה טכנית — מפעלים, תקלות, פקודות, עדכונים (בלי חיובים וצוות) · כספים — חיובים בלבד · רישיונות ומכירות — רישיונות בלבד (גם יוצרים) · צפייה בלבד — רואה הכל, לא משנה כלום.','Admin — everything · Technical support — plants, issues, commands, updates (no billing or staff) · Finance — billing only · Licenses and sales — licenses only (makes them) · View only — sees everything, changes nothing.')}</div></div>
    <div class="card"><div class="t" style="color:var(--gold);margin-bottom:6px">${L('➕ איש צוות חדש','➕ New staff member')}</div>
      <div class="row"><input id="sn" placeholder="${E(L('שם','Name'))}" style="flex:1"><select id="sr">${ro('support')}</select></div>
      <div style="padding:6px 0">${codeField('sc', L('קוד כניסה (לפחות 10 תווים)','Login code (at least 10 characters)'))}</div>
      <button class="btn" style="margin-top:10px" onclick="sadd()">${L('הוסף','Add')}</button><div id="aerr" class="err"></div>
      <div class="n" style="margin-top:6px">${L('מנהל חדש מקבל קוד שחזור — הוא מוצג כאן פעם אחת.','A new admin gets a recovery code — it is shown here once.')}</div>
      <div class="t" style="color:var(--gold);margin:16px 0 6px">${L('🛟 קוד השחזור שלי','🛟 My recovery code')}</div>
      <div class="n" style="margin-bottom:8px">${rs && rs.has ? L('✓ יש לך קוד שחזור. קוד חדש מבטל את הקודם.','✓ You have a recovery code. A new one cancels the old one.') : `<span class="a">${L('⚠ אין לך קוד שחזור. אם תשכח את הקוד — רק מנהל אחר או SQL.','⚠ You have no recovery code. If you forget your code — only another admin or SQL.')}</span>`}</div>
      <button class="ghost" onclick="newRecovery()">${L('צור קוד שחזור חדש','Make a new recovery code')}</button></div></div>
    <div class="card"><div class="t" style="color:var(--gold);margin-bottom:6px">${L('📜 מי עשה מה (100 אחרונים)','📜 Who did what (last 100)')}</div><div class="wrap"><table><tr><th>${L('מתי','When')}</th><th>${L('מי','Who')}</th><th>${L('מה','What')}</th><th>${L('פרטים','Details')}</th></tr>
      ${(d.audit || []).map(a => `<tr><td style="white-space:nowrap">${E(dt(a.at || a.created_at))}</td><td>${E(a.who)}</td><td>${E(a.action)}</td><td class="n" style="direction:ltr;text-align:left">${E(a.code ? '#' + a.code + ' ' : '')}${E(JSON.stringify(a.detail || {}).slice(0, 160))}</td></tr>`).join('') || `<tr><td colspan="4" class="n">${L('אין','None')}</td></tr>`}</table></div></div>`;
}
async function sadd(){
  const d = await rpc('sc_staff_add', { p_token: TOK, p_name: document.getElementById('sn').value.trim(), p_code: document.getElementById('sc').value, p_role: document.getElementById('sr').value });
  if(!d.ok){ document.getElementById('aerr').textContent = L('לא נוסף — ','Not added — ') + er(d.error); return; }
  if(d.recovery) SHOWN = { title: L('קוד השחזור של המנהל החדש — למסור לו','The new admin\'s recovery code — give it to them'), code: d.recovery };
  showStaff();
}
async function setCode(){
  const a = document.getElementById('nc1').value, b = document.getElementById('nc2').value, x = document.getElementById('ncerr');
  if(a !== b){ x.textContent = L('שני הקודים לא זהים','The two codes are not the same'); return; }
  const d = await rpc('sc_staff_set_code', { p_token: TOK, p_id: NEWC, p_code: a });
  if(!d.ok){ x.textContent = L('לא נשמר — ','Not saved — ') + er(d.error); return; }
  NEWC = null; showStaff(); setTimeout(() => { const e = document.getElementById('serr'); if(e){ e.className = 'g'; e.textContent = L('✓ הקוד החדש נשמר','✓ The new code was saved'); } }, 50);
}
async function newRecovery(){
  if(!confirm(L('ליצור קוד שחזור חדש? הקוד הקודם יפסיק לעבוד.','Make a new recovery code? The old one will stop working.'))) return;
  const d = await rpc('sc_recovery_new', { p_token: TOK });
  if(!d.ok){ alert(L('נכשל: ','Failed: ') + er(d.error)); return; }
  SHOWN = { title: L('קוד השחזור החדש שלך','Your new recovery code'), code: d.recovery }; showStaff();
}
async function sset(id, role, active){ const d = await rpc('sc_staff_set', { p_token: TOK, p_id: id, p_role: role, p_active: active }); if(!d.ok) alert(L('נכשל: ','Failed: ') + er(d.error)); showStaff(); }
async function hold(on){ const d = await rpc('sc_plant_hold', { p_token: TOK, p_code: CUR, p_hold: on }); if(!d.ok) alert(L('נכשל: ','Failed: ') + er(d.error)); showPlant(CUR); }
async function cmd(c){ const d = await rpc('sc_command_add', { p_token: TOK, p_code: CUR, p_cmd: c }); if(!d.ok) alert(L('נכשל: ','Failed: ') + er(d.error)); showPlant(CUR); }
async function showSettings(){
  mark('settings');
  const n = await rpc('sc_notify_get', { p_token: TOK }); const s = (n && n.settings) || {};
  const ch = (k, name, ph) => `<div class="row"><label><input type="checkbox" id="on_${k}" ${s[k]&&s[k].on?'checked':''}> ${name}</label>
     <input id="to_${k}" dir="ltr" style="flex:1;max-width:420px" placeholder="${ph}" value="${E(((s[k]&&s[k].to)||[]).join(', '))}"></div>`;
  main().innerHTML = `<div class="cols"><div class="card"><div class="t" style="color:var(--gold);margin-bottom:6px">${L('🔔 התראות — לבחור ערוצים','🔔 Alerts — choose the channels')}</div>
      ${ch('email',L('מייל','E-mail'),'support@company.com, ...')}${ch('sms','SMS','+972501234567, ...')}${ch('whatsapp',L('וואטסאפ','WhatsApp'),'+972501234567, ...')}
      <div class="row"><span>${L('מאיזו רמה','From which level')}</span><select id="minLevel"><option value="bad" ${s.minLevel!=='warn'?'selected':''}>${L('רק אדום (בעיה עכשיו)','Red only (problem now)')}</option><option value="warn" ${s.minLevel==='warn'?'selected':''}>${L('גם כתום (לטפל היום)','Also orange (handle today)')}</option></select></div>
      <button class="btn w" style="margin-top:10px" onclick="saveNotify()">${L('שמור','Save')}</button><div id="nerr" class="err"></div>
      <div class="n" style="margin-top:6px">${L('השליחה עצמה: notify.sh (פרטי שרת המייל ו-Twilio בקובץ notify.env).','The sending itself: notify.sh (the mail server and Twilio details are in notify.env).')}</div></div>
    <div class="card" style="${can('admin')?'':'display:none'}"><div class="t" style="color:var(--gold);margin-bottom:6px">${L('➕ מפעל חדש','➕ New plant')}</div>
      <div class="row"><input id="pc" dir="ltr" placeholder="${E(L('מספר (3–8 ספרות)','Number (3–8 digits)'))}"><input id="pn" placeholder="${E(L('שם המפעל','Plant name'))}" style="flex:1"></div>
      <button class="btn" style="margin-top:10px" onclick="addPlant()">${L('הוסף','Add')}</button><div id="perr" class="err"></div><div id="psec"></div></div></div>
    <div class="card w"><div class="t" style="color:var(--gold);margin-bottom:6px">${L('⬆ שלח עדכון לכל המפעלים','⬆ Send an update to all plants')}</div>
      <div class="n" style="margin-bottom:6px">${L('1. במחשב של היצרן (שבו המפתח הסודי):','1. On the manufacturer\'s computer (the one with the secret key):')} <code dir="ltr">bash release-sign.sh v10.39 app.html [02.sql]</code> — ${L('נוצר קובץ','this makes')} <code dir="ltr">release-v10.39.signed.json</code>. ${L('2. מעלים את הקבצים לכתובת https. 3. כאן: בוחרים את הקובץ החתום ונותנים את הכתובות.','2. Upload the files to an https address. 3. Here: choose the signed file and give the addresses.')}</div>
      <div class="row"><span class="n">${L('הקובץ החתום','The signed file')}</span><input id="rf" type="file" accept=".json,application/json" onchange="relFile(this)" style="flex:1"></div>
      <div id="rinfo" class="n" style="padding:4px 0"></div>
      <div class="row"><input id="ru" dir="ltr" placeholder="https://.../kosher-app.html" style="flex:1"></div>
      <div class="row" id="rqrow" style="display:none"><span class="n">${L('חלק שרת (02)','Server part (02)')}</span><input id="qu" dir="ltr" placeholder="https://.../02.sql" style="flex:1"></div>
      <button class="btn" style="margin-top:10px" onclick="release()">${L('שלח לכל המפעלים','Send to all plants')}</button><div id="rerr" class="err"></div>
      <div class="n" style="margin-top:6px">${L('כל מפעל בודק את החתימה של היצרן ואת ה-sha256 של כל קובץ, מריץ את 02 ואת בדיקת האבטחה (03) — ורק אם הכל עבר, הטאבלטים מקבלים את הגרסה. בלי חתימה נכונה — המפעל לא מתקין כלום. חלק שרת מותקן רק כשאף אחד לא עובד.','Each plant checks the manufacturer\'s signature and the sha256 of every file, runs 02 and the security check (03) — and only if all passed do the tablets get the version. Without a right signature the plant installs nothing. A server part is installed only when nobody works.')}</div></div></div>`;
}
const list = id => document.getElementById(id).value.split(',').map(x => x.trim()).filter(Boolean);
async function saveNotify(){
  const p = { minLevel: document.getElementById('minLevel').value };
  ['email','sms','whatsapp'].forEach(k => p[k] = { on: document.getElementById('on_'+k).checked, to: list('to_'+k) });
  const d = await rpc('sc_notify_set', { p_token: TOK, p_settings: p });
  const chn = { email:L('מייל','E-mail'), sms:'SMS', whatsapp:L('וואטסאפ','WhatsApp') };
  document.getElementById('nerr').textContent = d.ok ? L('✓ נשמר','✓ Saved') : (L('לא נשמר — ','Not saved — ') + (d.channel ? chn[d.channel] + L(': כתובת לא תקינה',': invalid address') : er(d.error)));
}
async function addPlant(){
  const d = await rpc('sc_plant_add', { p_token: TOK, p_code: document.getElementById('pc').value.trim(), p_name: document.getElementById('pn').value.trim() });
  document.getElementById('perr').textContent = d.ok ? '' : (d.error === 'code_taken' ? L('המספר תפוס','The number is taken') : d.error === 'no_permission' ? er(d.error) : L('מספר 3–8 ספרות ושם (בלי שורה חדשה)','A 3–8 digit number and a name (no new line)'));
  if(d.ok) document.getElementById('psec').innerHTML = `<div class="card" style="margin-top:10px;border-color:var(--gold)">${L('הסוד של מפעל','The secret of plant')} #${E(d.code)} — <b>${L('מוצג פעם אחת בלבד','shown only once')}</b>. ${L('להעתיק לקובץ gt-plant.conf של שרת המפעל:','Copy it into the plant server\'s gt-plant.conf:')}<br>
     <code dir="ltr" style="display:block;margin-top:6px;font-size:14px;text-align:left">GT_PLANT_CODE=${E(d.code)}<br>GT_PLANT_SECRET=${E(d.secret)}</code></div>`;
}
// (round-2 review P-up1) a release is the file signed on the manufacturer's computer (release-sign.sh)
let REL = null;
function relFile(inp){
  REL = null; const info = document.getElementById('rinfo'); info.textContent = '';
  const f = inp.files && inp.files[0]; if(!f) return;
  f.text().then(t => {
    try{ const o = JSON.parse(t), m = JSON.parse(o.manifest);
      if(typeof o.manifest !== 'string' || !/^[A-Za-z0-9+/]{86}==$/.test(o.sig || '') || !m.version || !/^[0-9a-f]{64}$/.test(m.app || '')) throw 0;
      REL = { manifest: o.manifest, sig: o.sig, m };
      info.innerHTML = '✓ ' + E(m.version) + ' · app ' + E(m.app.slice(0, 12)) + '…' + (m.sql ? ' · 02 ' + E(String(m.sql).slice(0, 12)) + '…' : ' · ' + L('בלי חלק שרת','no server part')) + ' · ' + L('נחתם','signed') + ' ' + E(dt(m.at));
      document.getElementById('rqrow').style.display = m.sql ? '' : 'none';
    }catch(e){ info.innerHTML = '<span class="r">' + E(L('זה לא קובץ חתום של release-sign.sh','This is not a file signed by release-sign.sh')) + '</span>'; }
  });
}
async function release(){
  const g = id => (document.getElementById(id) || {}).value ? document.getElementById(id).value.trim() : null;
  if(!REL){ document.getElementById('rerr').textContent = L('קודם בוחרים את הקובץ החתום','First choose the signed file'); return; }
  if(!confirm(L('לשלוח את הגרסה ' + REL.m.version + ' לכל המפעלים?','Send version ' + REL.m.version + ' to all plants?'))) return;
  const d = await rpc('sc_release_set', { p_token: TOK, p_version: REL.m.version, p_app_url: g('ru'), p_app_sha256: REL.m.app,
                                          p_sql_url: REL.m.sql ? g('qu') : null, p_sql_sha256: REL.m.sql || null, p_manifest: REL.manifest, p_sig: REL.sig });
  document.getElementById('rerr').textContent = d.ok ? L('✓ נשלח — המפעלים יתעדכנו בדיווח הבא','✓ Sent — the plants update at their next report')
    : d.error === 'not_signed' ? L('הקובץ החתום לא תואם','The signed file does not match') : d.error === 'no_permission' ? er(d.error) : L('לא נשלח — צריך כתובת https לכל קובץ','Not sent — every file needs an https address');
}
// the screens refresh every 30 s — but never under someone typing or choosing a file (it would be wiped)
const busyHere = () => { const a = document.activeElement; if(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && main().contains(a)) return true;
  return [...main().querySelectorAll('input')].some(i => (i.type === 'file' && i.files && i.files.length) || ((i.type === 'password' || i.type === 'text') && i.value)); };
setInterval(() => { if(!TOK || busyHere()) return; if(VIEW === 'overview') showOverview(); else if(VIEW === 'plant' && CUR) showPlant(CUR); else if(VIEW === 'tickets') showTickets(); }, 30000);
applyLang();
(async () => { if(!TOK) return showLogin(); const w = await raw('sc_whoami', { p_token: TOK }); if(!w.ok) return logout(); ME = { name: w.name, role: w.role }; chrome(true); home(); })();
</script></body></html>

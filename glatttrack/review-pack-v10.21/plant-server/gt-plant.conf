# GlattTrack plant server — one file per server (A and B differ only in the first block).
# Copy to /etc/glatttrack/gt-plant.conf on each server.

# ── this server ─────────────────────────────────────────────────────────────
GT_SELF=A                       # A on the first server, B on the second
GT_SELF_IP=192.168.1.11         # this server's own fixed address
GT_PEER_IP=192.168.1.12         # the OTHER server's fixed address

# ── both servers (the same values) ──────────────────────────────────────────
GT_VIP=192.168.1.10             # the ONE address the tablets use (floating)
GT_IFACE=eth0                   # network interface that carries the floating address
GT_PG_BIN=/usr/lib/postgresql/16/bin
GT_PGDATA=/var/lib/postgresql/16/main
GT_PG_PORT=5432
GT_DB=postgres
GT_REPL_USER=gt_replicator
GT_REPL_PASS=                        # REQUIRED: a long random password (16+ chars), the same on both servers
                                     #   e.g.  openssl rand -hex 24      — the tools refuse to run without it
GT_STANDBY_APP=gt_standby            # the standby's name in the replication
GT_BACKUP_DIR=/mnt/gt-backup         # external disk (USB) for the nightly backup
GT_BACKUP_KEEP_DAYS=14
GT_GATEWAY_IP=192.168.1.1      # the plant router — a server that cannot see it never takes over
GT_VRRP_PASS=                        # REQUIRED: 8 random characters, the same on both servers (floating-address messages)
GT_LOG=/var/log/glatttrack-plant.log

# ── decisions of the plant (read PLANT-RESILIENCE-HE.md §4 before changing) ─────
GT_SYNC_MODE=available   # available = when the backup server is gone ~6 s, the main server goes on alone
                         #             (work never stops; a ruling made then lives on ONE server until the
                         #              backup server is back — if the main server's disk dies in that window,
                         #              those rulings are lost)
                         # strict    = a ruling is confirmed ONLY when both servers have it; when the backup
                         #             server is gone, work stops (tablets lock) until it is back
GT_AUTO_PROMOTE=0        # 0 = the backup server never takes over by itself: someone confirms the main server
                         #     is really off, then runs takeover.sh (no two main servers, ever)
                         # 1 = automatic takeover — ONLY with a third "witness" device (not in this kit yet)

# ── the nightly check (nightly-check.sh, before work) ───────────────────────────
GT_API_URL=http://127.0.0.1:8000          # the address the tablets use for the server API (Kong / PostgREST)
GT_API_KEY=                               # the anon key (the same one as in gt-config.js)
GT_API_RESTART_CMD="docker compose -f /opt/supabase/docker/docker-compose.yml restart rest kong"   # how to restart a stuck API
GT_SELFTEST_SQL=/opt/glatttrack/sql/03-security-selftest.sql   # the security self-test file (03)
GT_EXPECT_STEP=46
GT_MIN_FREE_PCT=15
GT_TLS_CERT=                              # e.g. /etc/ssl/glatttrack/fullchain.pem (empty: no https check)
GT_PLANT_NAME=
GT_ALERT_CMD=                             # optional, needs internet. The message is in $GT_ALERT_TEXT, e.g.
                                          #   curl -s -d "$GT_ALERT_TEXT" https://ntfy.sh/your-secret-topic

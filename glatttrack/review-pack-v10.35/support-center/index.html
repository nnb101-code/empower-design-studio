<!doctype html><html dir="rtl" lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GlattTrack — מרכז שירות</title>
<script src="sc-config.js"></script>
<style>
:root{--bg:#07090F;--panel:#11151F;--panel2:#181D2A;--border:#2A3142;--gold:#D4A843;--text:#E8ECF4;--muted:#8A93A6;--green:#28C76F;--red:#E03030;--amber:#F0A030}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:18px;margin:0;color:var(--gold);flex:1}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--gold);color:#07090F;border:none;border-radius:8px;padding:9px 14px;font-weight:700;font-size:14px}
.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px}
main{padding:16px;max-width:1300px;margin:0 auto}
.tiles{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.tile{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.tile b{display:block;font-size:30px}.n{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pl{background:var(--panel);border:2px solid var(--border);border-radius:12px;padding:12px;cursor:pointer}
.pl.warn{border-color:var(--amber)}.pl.bad{border-color:var(--red);background:#2a0e10;animation:blink 1s infinite}
@keyframes blink{50%{background:#4a1015}}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-inline-start:6px;vertical-align:middle}
.ok .dot,.dot.ok{background:var(--green)}.warn .dot,.dot.warn{background:var(--amber)}.bad .dot,.dot.bad{background:var(--red);box-shadow:0 0 12px var(--red)}
.t{font-size:16px;font-weight:800}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px}
.g{color:var(--green)}.r{color:var(--red)}.a{color:var(--amber)}
input,select{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-size:14px;font-family:inherit}
.cols{display:flex;gap:12px;flex-wrap:wrap}.cols>.card{flex:1;min-width:300px}
.err{color:var(--red);font-size:13px;margin-top:6px}
</style></head><body>
<header><h1>🛰️ GlattTrack — מרכז השירות</h1><span id="who" class="n"></span>
 <button class="ghost" id="bSettings" style="display:none" onclick="showSettings()">⚙ הגדרות</button>
 <button class="ghost" id="bHome" style="display:none" onclick="showOverview()">🏠 כל המפעלים</button>
 <button class="ghost" id="bOut" style="display:none" onclick="logout()">יציאה</button></header>
<main id="main"></main>
<script>
const SC = window.SC_SERVER || {};
let TOK = sessionStorage.getItem('sc_tok') || '', VIEW = 'overview', CUR = null, lastBad = new Set();
const E = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TXT = { no_report:'המפעל לא מדווח (אין אינטרנט / השרת כבוי)', standby_down:'שרת הגיבוי לא מחובר', standby_lag:'שרת הגיבוי מפגר',
  backup_stale:'אין גיבוי מאומת', backup_unknown:'אין מידע על גיבוי', chain_broken:'יומן האירועים שבור', nightly_check_problems:'בדיקת הלילה מצאה בעיות',
  nightly_check_fixed:'בדיקת הלילה תיקנה לבד', nightly_check_missing:'בדיקת הלילה לא רצה', ups_on_battery:'אין חשמל — על סוללה', ups_low_battery:'סוללת UPS כמעט ריקה',
  devices_offline:'טאבלטים לא מחוברים', tablet_offline_while_working:'טאבלט מנותק בזמן עבודה', failed_logins:'הרבה כניסות שגויות',
  revoked_device_writes:'מכשיר מנותק ניסה לכתוב', rollover_waiting:'האיפוס היומי ממתין', label_mismatch:'מדבקה שלא תואמת פסיקה',
  test_mode_on:'מצב בדיקה פעיל', one_leader_device:'רק מכשיר ראש צוות אחד', leader_recovery_missing:'אין קוד שחזור לראש צוות',
  standby_async:'השרת הראשי מאשר לבד', failover_recent:'השרת הוחלף השבוע', processing_days_open:'ימי עיבוד פתוחים', worker_lists_check:'לבדוק רשימות עובדים' };
const tx = c => TXT[c] || c;
const ROLE = { slaughter:'שחיטה', esophagus:'וושט', legs:'רגליים', inner:'פנים', outer:'חוץ', parts:'חלקים', stamps:'חותמות', display:'ספירה', leader:'ראש צוות',
  cooler:'קולר', nikur:'מנקר', salting:'מליחה', shipping:'שיפינג' };
async function rpc(fn, args){
  const r = await fetch(SC.url + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SC.anonKey, Authorization:'Bearer ' + SC.anonKey }, body: JSON.stringify(args || {}) });
  let d = null; try{ d = await r.json(); }catch(e){}
  if(d && d.ok === false && d.error === 'unauthorized' && fn !== 'sc_login'){ logout(); }
  return d || { ok:false, error:'network' };
}
const main = () => document.getElementById('main');
function chrome(on){ ['bSettings','bHome','bOut'].forEach(id => document.getElementById(id).style.display = on ? '' : 'none'); }
function logout(){ TOK=''; sessionStorage.removeItem('sc_tok'); chrome(false); showLogin(); }
function showLogin(){
  main().innerHTML = `<div class="card" style="max-width:380px;margin:60px auto;text-align:center"><div class="t" style="margin-bottom:12px">כניסה לשירות לקוחות</div>
    <input id="code" type="password" placeholder="קוד" style="width:100%" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn" style="width:100%;margin-top:10px" onclick="doLogin()">כניסה</button><div id="lerr" class="err"></div></div>`;
  setTimeout(()=>document.getElementById('code')?.focus(), 50);
}
async function doLogin(){
  const d = await rpc('sc_login', { p_code: document.getElementById('code').value });
  if(!d.ok){ document.getElementById('lerr').textContent = d.error === 'rate_limited' ? 'יותר מדי ניסיונות — לחכות 15 דקות' : 'קוד שגוי'; return; }
  TOK = d.token; sessionStorage.setItem('sc_tok', TOK); document.getElementById('who').textContent = d.name; chrome(true); showOverview();
}
function beep(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(), o=c.createOscillator(), g=c.createGain(); o.frequency.value=880; o.connect(g); g.connect(c.destination); g.gain.value=.2; o.start(); setTimeout(()=>{o.stop(); c.close();}, 600); }catch(e){} }
async function showOverview(){
  VIEW='overview'; CUR=null;
  const d = await rpc('sc_overview', { p_token: TOK }); if(!d.ok){ main().innerHTML = '<div class="err">' + E(d.error) + '</div>'; return; }
  const P = d.plants || [], c = { ok:0, warn:0, bad:0 }; P.forEach(p => c[p.level] = (c[p.level]||0) + 1);
  const upToDate = d.release ? P.filter(p => p.appVersion === d.release).length : null;
  const bad = new Set(P.filter(p => p.level === 'bad').map(p => p.code)); if([...bad].some(x => !lastBad.has(x))) beep(); lastBad = bad;
  main().innerHTML = `<div class="tiles"><div class="tile"><b class="g">${c.ok}</b><span class="n">תקין</span></div><div class="tile"><b class="a">${c.warn}</b><span class="n">לטפל היום</span></div>
    <div class="tile"><b class="r">${c.bad}</b><span class="n">בעיה עכשיו</span></div><div class="tile"><b>${E(d.release || '—')}</b><span class="n">גרסה אחרונה${upToDate!=null?' · '+upToDate+'/'+P.length+' מעודכנים':''}</span></div></div>
    <div class="grid">${P.map(p => `<div class="pl ${p.level}" onclick="showPlant('${E(p.code)}')"><div class="t">#${E(p.code)} · ${E(p.name)}<span class="dot"></span></div>
      <div class="n">${p.problems && p.problems.length ? '⚠ ' + p.problems.map(tx).map(E).join(' · ') : 'תקין'}</div>
      <div class="n">עובד עכשיו: ${p.working ? 'כן' : 'לא'} · ${E(p.appVersion || '?')} · ${p.reportedAt ? new Date(p.reportedAt).toLocaleTimeString('he-IL') : 'לא דיווח'}</div></div>`).join('') || '<div class="n">אין מפעלים — מוסיפים ב"הגדרות"</div>'}</div>`;
}
const row = (k, v, cls) => `<div class="row"><span>${E(k)}</span><span class="${cls||''}">${E(v)}</span></div>`;
async function showPlant(code){
  VIEW='plant'; CUR=code;
  const d = await rpc('sc_plant', { p_token: TOK, p_code: code }); if(!d.ok){ main().innerHTML = '<div class="err">' + E(d.error) + '</div>'; return; }
  const r = d.report || {}, sv = r.server || {}, bk = r.backup || {}, ng = r.nightly || null, ch = r.eventChain || {}, sec = r.security || {};
  const st = (sv.standbys || []).find(s => s.state === 'streaming');
  let h = `<div class="t" style="font-size:20px;margin-bottom:10px">#${E(d.code)} · ${E(d.name)} <span class="dot ${E(d.level||'bad')}"></span>
     <span class="n">דיווח אחרון: ${d.reportedAt ? new Date(d.reportedAt).toLocaleString('he-IL') : '—'}</span></div><div class="cols"><div class="card"><div class="t" style="color:var(--gold);margin-bottom:6px">מצב השרת</div>`;
  h += row('שרת ראשי', sv.role === 'primary' ? '✓ עונה' : (sv.role || '?'), sv.role === 'primary' ? 'g' : 'a');
  h += row('שרת גיבוי', (r.attention||[]).includes('standby_down') ? '✕ לא מחובר' : st ? '✓ מחובר' : 'אין', (r.attention||[]).includes('standby_down') ? 'r' : 'g');
  const BK = { unknown:'אין מידע', stale:'ישן — ' + bk.ageHours + ' שעות', failed:'הבדיקה האחרונה נכשלה', never:'אין גיבוי מאומת' };
  h += row('גיבוי', bk.status === 'ok' ? '✓ לפני ' + bk.ageHours + ' שעות' : (BK[bk.status] || bk.status || '?'), bk.status === 'ok' ? 'g' : (bk.status === 'unknown' ? 'a' : 'r'));
  h += row('בדיקת לילה', ng ? ((ng.problems||[]).length ? (ng.problems.length + ' בעיות') : '✓ תקין') : 'לא רצה', ng && !(ng.problems||[]).length ? 'g' : 'r');
  if(ng && (ng.problems||[]).length) h += '<div class="n r" style="padding:4px 0">' + ng.problems.map(E).join('<br>') + '</div>';
  h += row('יומן האירועים', ch.ok ? '✓' : '✕ שבור', ch.ok ? 'g' : 'r');
  h += row('כניסות שגויות (24 ש׳)', sec.failedLogins24h|0, (sec.failedLogins24h|0) >= 10 ? 'r' : 'g');
  h += row('גרסת המפעל', r.appVersion || '?'); h += row('עובד עכשיו', r.working ? 'כן' : 'לא');
  h += `</div><div class="card"><div class="t" style="color:var(--gold);margin-bottom:6px">טאבלטים</div>`;
  (r.tablets || []).forEach(t => { h += row((ROLE[t.role] || t.role) + (t.index ? ' ' + (t.index+1) : ''), (t.online ? '● מחובר' : '○ מנותק') + ' · ' + (t.version || '?'), t.online ? 'g' : 'r'); });
  h += `<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button class="btn" onclick="cmd('restart_standby')">🔄 הפעל מחדש את שרת הגיבוי</button><button class="ghost" onclick="cmd('reload_tablets')">♻ רענן טאבלטים</button>
      <button class="ghost" onclick="cmd('update_now')">⬆ עדכן מפעל זה</button><button class="ghost" onclick="cmd('run_nightly_check')">🩺 הרץ בדיקת לילה</button></div>
      <div class="n" style="margin-top:6px">הפקודה מתבצעת בדיווח הבא של המפעל (עד 5 דקות). רענון / עדכון של טאבלט לא מפריע לעבודה — טאבלט בשימוש שואל את העובד.</div></div></div>`;
  h += `<div class="cols"><div class="card"><div class="t" style="color:var(--gold);margin-bottom:6px">התראות</div>${(d.alerts||[]).map(a => row(new Date(a.created_at).toLocaleString('he-IL') + ' · ' + tx(a.text), a.resolved_at ? '✓ נסגר' : 'פתוח', a.resolved_at ? 'g' : (a.level === 'bad' ? 'r' : 'a'))).join('') || '<div class="n">אין</div>'}</div>
     <div class="card"><div class="t" style="color:var(--gold);margin-bottom:6px">פקודות</div>${(d.commands||[]).map(c => row(new Date(c.created_at).toLocaleString('he-IL') + ' · ' + c.cmd, c.done_at ? (c.result || '✓') : (c.delivered_at ? 'נשלח למפעל' : 'ממתין'))).join('') || '<div class="n">אין</div>'}</div></div>`;
  main().innerHTML = h;
}
async function cmd(c){ const d = await rpc('sc_command_add', { p_token: TOK, p_code: CUR, p_cmd: c }); if(!d.ok) alert('נכשל: ' + d.error); showPlant(CUR); }
async function showSettings(){
  VIEW='settings';
  const n = await rpc('sc_notify_get', { p_token: TOK }); const s = (n && n.settings) || {};
  const ch = (k, name, ph) => `<div class="row"><label><input type="checkbox" id="on_${k}" ${s[k]&&s[k].on?'checked':''}> ${name}</label>
     <input id="to_${k}" style="flex:1;max-width:420px" placeholder="${ph}" value="${E(((s[k]&&s[k].to)||[]).join(', '))}"></div>`;
  main().innerHTML = `<div class="cols"><div class="card"><div class="t" style="color:var(--gold);margin-bottom:6px">🔔 התראות — לבחור ערוצים</div>
      ${ch('email','מייל','support@company.com, ...')}${ch('sms','SMS','+972501234567, ...')}${ch('whatsapp','וואטסאפ','+972501234567, ...')}
      <div class="row"><span>מאיזו רמה</span><select id="minLevel"><option value="bad" ${s.minLevel!=='warn'?'selected':''}>רק אדום (בעיה עכשיו)</option><option value="warn" ${s.minLevel==='warn'?'selected':''}>גם כתום (לטפל היום)</option></select></div>
      <button class="btn" style="margin-top:10px" onclick="saveNotify()">שמור</button><div id="nerr" class="err"></div>
      <div class="n" style="margin-top:6px">השליחה עצמה: notify.sh (פרטי שרת המייל ו-Twilio בקובץ notify.env).</div></div>
    <div class="card"><div class="t" style="color:var(--gold);margin-bottom:6px">➕ מפעל חדש</div>
      <div class="row"><input id="pc" placeholder="מספר (3–8 ספרות)"><input id="pn" placeholder="שם המפעל" style="flex:1"></div>
      <button class="btn" style="margin-top:10px" onclick="addPlant()">הוסף</button><div id="perr" class="err"></div><div id="psec"></div></div></div>
    <div class="card"><div class="t" style="color:var(--gold);margin-bottom:6px">⬆ שלח עדכון לכל המפעלים</div>
      <div class="row"><input id="rv" placeholder="גרסה, למשל v10.36"><input id="ru" placeholder="https://.../kosher-app.html" style="flex:1"><input id="rs" placeholder="sha256 של הקובץ" style="flex:1"></div>
      <div class="row"><span class="n">חלק שרת (02, לא חובה)</span><input id="qu" placeholder="https://.../02.sql" style="flex:1"><input id="qs" placeholder="sha256" style="flex:1"></div>
      <button class="btn" style="margin-top:10px" onclick="release()">שלח לכל המפעלים</button><div id="rerr" class="err"></div>
      <div class="n" style="margin-top:6px">כל מפעל מוריד, בודק את ה-sha256, מריץ את 02 ואת בדיקת האבטחה (03) — ורק אם עברה, הטאבלטים מקבלים את הגרסה. חלק שרת מותקן רק כשאף אחד לא עובד. בלי אישור ראש צוות.</div></div>`;
}
const list = id => document.getElementById(id).value.split(',').map(x => x.trim()).filter(Boolean);
async function saveNotify(){
  const p = { minLevel: document.getElementById('minLevel').value };
  ['email','sms','whatsapp'].forEach(k => p[k] = { on: document.getElementById('on_'+k).checked, to: list('to_'+k) });
  const d = await rpc('sc_notify_set', { p_token: TOK, p_settings: p });
  document.getElementById('nerr').textContent = d.ok ? '✓ נשמר' : ('לא נשמר — ' + (d.channel ? ({email:'מייל',sms:'SMS',whatsapp:'וואטסאפ'})[d.channel] + ': כתובת לא תקינה' : d.error));
}
async function addPlant(){
  const d = await rpc('sc_plant_add', { p_token: TOK, p_code: document.getElementById('pc').value.trim(), p_name: document.getElementById('pn').value.trim() });
  document.getElementById('perr').textContent = d.ok ? '' : (d.error === 'code_taken' ? 'המספר תפוס' : 'מספר 3–8 ספרות ושם');
  if(d.ok) document.getElementById('psec').innerHTML = `<div class="card" style="margin-top:10px;border-color:var(--gold)">הסוד של מפעל #${E(d.code)} — <b>מוצג פעם אחת בלבד</b>. להעתיק לקובץ gt-plant.conf של שרת המפעל:<br>
     <code dir="ltr" style="display:block;margin-top:6px;font-size:14px">GT_PLANT_CODE=${E(d.code)}<br>GT_PLANT_SECRET=${E(d.secret)}</code></div>`;
}
async function release(){
  const g = id => document.getElementById(id).value.trim() || null;
  if(!confirm('לשלוח את הגרסה ' + (g('rv')||'') + ' לכל המפעלים?')) return;
  const d = await rpc('sc_release_set', { p_token: TOK, p_version: g('rv'), p_app_url: g('ru'), p_app_sha256: g('rs'), p_sql_url: g('qu'), p_sql_sha256: g('qs') });
  document.getElementById('rerr').textContent = d.ok ? '✓ נשלח — המפעלים יתעדכנו בדיווח הבא' : 'לא נשלח — צריך גרסה, כתובת https ו-sha256 (64 תווים)';
}
setInterval(() => { if(!TOK) return; if(VIEW === 'overview') showOverview(); else if(VIEW === 'plant' && CUR) showPlant(CUR); }, 30000);
if(TOK){ chrome(true); showOverview(); } else showLogin();
</script></body></html>
